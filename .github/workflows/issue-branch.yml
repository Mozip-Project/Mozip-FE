name: Issue Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create branch and leave a handoff comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const body = issue.body ?? '';
            const baseBranch = 'main';
            const branchTypes = new Set(['feat', 'fix', 'hotfix', 'refactor', 'test', 'docs', 'chore']);
            const labelMap = {
              feat: '✨ Feature',
              fix: '🐛 BugFix',
              hotfix: '🚨 Hotfix',
              refactor: '♻️ Refactor',
              test: '✅ Test',
              docs: '📝 Docs',
              chore: '🔧 Chore',
            };
            const titleTypeMap = {
              feat: 'Feat',
              fix: 'Fix',
              hotfix: 'Hotfix',
              refactor: 'Refactor',
              test: 'Test',
              docs: 'Docs',
              chore: 'Chore',
            };

            const readSection = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`###\\s+${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i'));
              return match?.[1]?.trim() ?? '';
            };

            const branchType = readSection('작업 타입').match(/\b(feat|fix|hotfix|refactor|test|docs|chore)\b/i)?.[1]?.toLowerCase();
            const branchSlug = readSection('브랜치 이름').trim();
            const isValidBranchSlug = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(branchSlug);

            if (!branchTypes.has(branchType) || !isValidBranchSlug) {
              core.setFailed('작업 이슈 양식에서 작업 타입과 영문 브랜치 이름을 올바르게 입력해주세요.');
              return;
            }

            const branchName = `${branchType}/${issueNumber}-${branchSlug}`;
            const normalizedTitle = `[${titleTypeMap[branchType]}] ${issue.title.replace(/^\[[^\]]+\]\s*/, '').trim()}`;

            let created = true;
            try {
              const baseRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${baseBranch}`,
              });

              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: baseRef.data.object.sha,
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
              created = false;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: normalizedTitle,
            });

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [issue.user.login],
              });
            } catch (error) {
              core.warning(`Failed to assign the issue author: ${error.message}`);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [labelMap[branchType]],
            });

            const commentBody = [
              created ? '작업 브랜치를 생성했습니다.' : '작업 브랜치가 이미 존재합니다.',
              '',
              `- Branch: \`${branchName}\``,
              `- Base: \`${baseBranch}\``,
              '',
              '```bash',
              'git fetch origin',
              `git switch ${branchName}`,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody,
            });
