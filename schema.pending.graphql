# 서버에 아직 없는 query·mutation의 명세 기준 임시 정의, 응답은 MSW handler
# 서버에 생기면 pnpm schema:pull로 받은 schema.graphql에 있는지 확인한 뒤 여기서 삭제
# 서버에 Mutation 타입이 생기면 아래 type Mutation을 extend type Mutation으로 변경

extend type Query {
  "tab 생략 시 전체 탭, 최신순"
  notifications(tab: NotificationTab, page: Int = 0, size: Int = 20): NotificationPage!
  me: Me!
  "대표자 먼저, 그 뒤 합류일 오름차순. 내보내진 운영진 제외"
  members(organizationId: ID!): [Member!]!
  "심사 전이거나 반려된 단체는 소속 운영진이 아니면 ORG_404"
  organization(id: ID!): Organization! @public
  "다른 단체가 등록한 키워드 중 접두 일치, 많이 쓴 순"
  keywordSuggestions(query: String!, limit: Int = 5): [String!]!
  "모집 중인 공고 카드, 기본 정렬은 bumpedAt 최신순"
  postings(
    filter: PostingFilter
    sort: PostingSort = LATEST
    page: Int = 0
    size: Int = 20
  ): PostingPage! @public
  posting(id: ID!): Posting! @public
  "공고 관리 탭: 진행 중 [RECRUITING, DOC_REVIEW, DOC_RESULT_NOTICE, INTERVIEW, FINAL_RESULT] / 작성 중 [DRAFT] / 종료 [ENDED]"
  organizationPostings(organizationId: ID!, status: [PostingStatus!]): [Posting!]!
  "지원자 관리: 제출된 지원서만 10행씩. positionId null = 전체, keyword는 이름 부분 일치"
  postingApplications(
    postingId: ID!
    positionId: ID
    keyword: String
    sort: ApplicationSort = SUBMITTED_DESC
    page: Int = 1
  ): PostingApplicationPage!
  "서류 평가 목록: 제출된 지원서만 10행씩, 탭은 로그인한 운영진의 평가 상태 기준. positionIds null·빈 배열 = 전체"
  docEvaluationApplications(
    postingId: ID!
    tab: DocEvaluationTab = ALL
    positionIds: [ID!]
    keyword: String
    sort: ApplicationSort = SUBMITTED_DESC
    page: Int = 1
  ): DocEvaluationApplicationPage!
  "서류 평가하기 칩: 목록과 같은 조건·순서로 페이지 없이 전부"
  docEvaluationApplicationChips(
    postingId: ID!
    tab: DocEvaluationTab = ALL
    positionIds: [ID!]
    keyword: String
    sort: ApplicationSort = SUBMITTED_DESC
  ): [DocEvaluationApplicationRow!]!
  "지원서 상세: 개발 서버에는 있으나 schema:pull 충돌 이슈로 pull 전까지 임시 정의. 본인 또는 그 공고 단체 운영진만"
  application(id: ID!): Application!
  "서류 평가하기 패널: 로그인한 운영진의 그 지원서 평가, 평가 전이면 null. 확정 후에도 그대로 내려줌"
  myDocEvaluation(applicationId: ID!): DocEvaluation
  "서류 평가 취합: 제출된 지원서만 10행씩, 탭은 application.docResult 기준(PENDING은 ALL에만). summary는 필터와 무관한 공고 전체"
  docEvaluationSummary(
    postingId: ID!
    tab: DocResultTab = ALL
    positionIds: [ID!]
    keyword: String
    "null이면 점수 쓰는 공고 SCORE_DESC, 아니면 PASS_OPINION_DESC"
    sort: DocSummarySort
    page: Int = 1
  ): DocEvaluationSummaryPage!
}

enum DocResultTab {
  "PENDING 포함"
  ALL
  PASS
  HOLD
  FAIL
}

enum DocSummarySort {
  SCORE_DESC
  SCORE_ASC
  NAME_ASC
  NAME_DESC
  "점수 안 쓰는 공고 기본"
  PASS_OPINION_DESC
}

type DocEvaluationSummaryPage {
  rows: [DocEvaluationSummaryRow!]!
  "탭 + 포지션 필터 + 검색어 적용"
  totalCount: Int!
  "포지션 필터 + 검색어 적용, 탭 조건 제외. hold가 하단 바 보류 인원"
  tabCounts: DocResultTabCounts!
  "검색어만 적용. 포지션 없는 모집은 빈 배열"
  positionCounts: [PositionCount!]!
  page: Int!
  "0이면 빈 화면, 페이지 번호 숨김"
  totalPages: Int!
  "공고 전체, 필터 무관"
  summary: DocResultSummary!
}

type DocEvaluationSummaryRow {
  application: Application!
  "평가 완료된 지원자끼리 평균 내림차순, 미완료면 null"
  rank: Int
  "소수 1자리. 점수 안 쓰는 공고면 null, 진행 중이면 저장된 평가만으로"
  averageScore: Float
  opinionCounts: OpinionCounts!
  "운영진 전원 SAVED, false면 결과 토글 비활성"
  evaluationComplete: Boolean!
}

type OpinionCounts {
  pass: Int!
  hold: Int!
  fail: Int!
  "아직 SAVED 안 한 운영진 수"
  notEvaluated: Int!
}

type DocResultTabCounts {
  all: Int!
  pass: Int!
  hold: Int!
  fail: Int!
}

type DocResultSummary {
  "제출 지원서 수"
  totalCount: Int!
  "전원 평가 완료된 지원서 수"
  evaluatedCount: Int!
  allEvaluated: Boolean!
  passCount: Int!
  holdCount: Int!
  failCount: Int!
  "결과 안 고른 수"
  pendingCount: Int!
  "allEvaluated && holdCount == 0 && pendingCount == 0 && totalCount > 0"
  canConfirm: Boolean!
  "null이면 확정 전"
  docResultConfirmedAt: DateTime
}

enum DocEvaluationTab {
  ALL
  "내 평가가 NONE 또는 DRAFT"
  NOT_EVALUATED
  "내 평가가 SAVED"
  EVALUATED
}

enum MyDocEvaluationStatus {
  NONE
  "자동 저장만 됨, 목록에서는 평가 전"
  DRAFT
  SAVED
}

type DocEvaluationApplicationPage {
  rows: [DocEvaluationApplicationRow!]!
  "탭 + 포지션 필터 + 검색어 적용"
  totalCount: Int!
  "포지션 필터 + 검색어 적용, 탭 조건 제외"
  tabCounts: DocEvaluationTabCounts!
  "검색어만 적용. 포지션 없는 모집은 빈 배열"
  positionCounts: [PositionCount!]!
  page: Int!
  "0이면 빈 화면, 페이지 번호 숨김"
  totalPages: Int!
}

type DocEvaluationApplicationRow {
  application: Application!
  myEvaluationStatus: MyDocEvaluationStatus!
}

type DocEvaluationTabCounts {
  all: Int!
  notEvaluated: Int!
  evaluated: Int!
}

enum ApplicationSort {
  SUBMITTED_DESC
  SUBMITTED_ASC
  NAME_ASC
  NAME_DESC
}

type PostingApplicationPage {
  rows: [Application!]!
  "전체 탭 숫자, 검색어 적용·포지션 탭 무시"
  totalCount: Int!
  "포지션 탭 숫자, 검색어 적용. 포지션 없는 모집은 빈 배열"
  positionCounts: [PositionCount!]!
  page: Int!
  "0이면 빈 화면, 페이지 번호 숨김"
  totalPages: Int!
}

type PositionCount {
  position: Position!
  count: Int!
}

extend type Organization {
  "공고 관리 탭 숫자"
  postingCounts: PostingCounts!
}

type PostingCounts {
  "RECRUITING ~ FINAL_RESULT"
  published: Int!
  draft: Int!
  ended: Int!
}

# 공고 작성(savePostingDraft) 명세의 문항 설정, 서버 스키마는 아직 이전 유형(SINGLE_CHOICE·TABLE 등)
extend enum QuestionType {
  ACTIVITY
}

enum ActivityField {
  "활동명. 끄면 접힌 제목이 '활동 경험 1, 2...'로 고정"
  NAME
  "활동 기간 YYYY.MM ~ YYYY.MM"
  PERIOD
  ROLE
  ACHIEVEMENT
}

enum FileType {
  PDF
  IMAGE
  PPT
  MP4
}

extend type QuestionOptions {
  activityFields: [ActivityField!]
  "ACTIVITY 최대 개수 (기본 3)"
  maxEntries: Int
  acceptFile: Boolean
  acceptLink: Boolean
  "acceptFile일 때 1개 이상"
  fileTypes: [FileType!]
}

extend type Posting {
  "같은 단체의 RECRUITING 공고, 현재 공고 제외"
  otherActivePostings: [Posting!]!
  "비로그인·운영진이면 빈 배열, 포지션 없는 모집은 최대 1개"
  myApplications: [Application!]!
  profilePhotoRequired: Boolean!
  "제출된 지원서 수"
  applicationCount: Int!
  "전체 공고 최신순(bumpedAt 내림차순) 순위, DRAFT·ENDED는 null"
  bumpRank: Int
}

type Me {
  id: ID!
  "로그인 ID, 화면에서 가운데 4자리 마스킹"
  phone: String!
  name: String!
  "null이면 기본 아바타"
  profileImageUrl: String
  email: String
  "null이면 학교 인증 전"
  school: School
  "승인된 인증. email이 인증 이메일, 재학증명서면 null"
  schoolVerification: SchoolVerification
  lastRole: Role!
  "운영진 홈에서 마지막으로 본 단체"
  lastOrganization: Organization
  memberships: [Member!]!
  notificationSettings: NotificationSettings!
  unreadNotificationCount: Int!
}

type NotificationSettings {
  "지원 결과 및 면접 일정"
  notifyResult: Boolean!
  "스크랩 공고 모집 시작"
  notifyScrap: Boolean!
  "운영진 활동 알림"
  notifyOperator: Boolean!
  "이벤트 및 마케팅"
  marketingAgreed: Boolean!
}

"보내지 않은 필드는 그대로 유지"
input NotificationSettingsInput {
  notifyResult: Boolean
  notifyScrap: Boolean
  notifyOperator: Boolean
  marketingAgreed: Boolean
}

type Mutation {
  "ids 없으면 전체 읽음"
  markNotificationsRead(ids: [ID!]): Boolean!
  reportPosting(postingId: ID!, reason: ReportReason!, detail: String): Boolean!
  "단체명은 받지 않음, 검증 실패는 ORG_400"
  updateOrganization(id: ID!, input: UpdateOrganizationInput!): Organization!
  updateNotificationSettings(input: NotificationSettingsInput!): Me!
  "대표자로 있는 단체가 남아 있으면 USER_409, 성공 후 프론트가 /auth/logout 호출"
  withdraw: Boolean!
  "phone은 verifyPhoneChange를 10분 안에 통과한 번호만, 아니면 USER_403"
  updateProfile(input: UpdateProfileInput!): Me!
  "인증번호 6자리 SMS, 3분 유효. 같은 번호 1분에 1회(USER_429), 가입된 번호면 USER_001"
  requestPhoneChange(phone: String!): Boolean!
  "불일치 또는 만료면 USER_400"
  verifyPhoneChange(phone: String!, code: String!): Boolean!
  "현재 비밀번호 불일치는 AUTH_001, 성공하면 다른 기기 로그인 끊김"
  changePassword(input: ChangePasswordInput!): Boolean!
  "공고 하나에 한 사람당 1개, 첫 호출에 DRAFT로 생성하고 이후 덮어씀. 모집 기간 밖 POSTING_409, 제출 뒤 APPLICATION_409"
  saveApplicationDraft(postingId: ID!, input: ApplicationInput!): Application!
  "필수 문항 검증 후 SUBMITTED, 제출 시점 프로필 복사. 미작성 APPLICATION_400(fieldErrors는 questionId별), 마감 POSTING_409, 이미 제출 APPLICATION_409, 자격 불충족 USER_403"
  submitApplication(id: ID!): Application!
  "잔여권 1 차감 후 최신순 맨 위로, 잔여권 없으면 PAYMENT_402, RECRUITING이 아니면 POSTING_409"
  bumpPosting(id: ID!): Posting!
  "DRAFT만 삭제 가능, 아니면 POSTING_409"
  deletePosting(id: ID!): Boolean!
  "제출 지원자 전원에게 바로 발송, 제목 1~100자·본문 1~1,000자, DRAFT면 MESSAGE_409, 받는 사람 없으면 MESSAGE_422"
  sendNotice(postingId: ID!, subject: String!, body: String!): Message!
  """
  공고 작성 저장. id가 없으면 새 DRAFT 생성(title 필수), 있으면 이어서 저장
  input은 보내는 필드만 반영, DRAFT가 아니면 POSTING_409(NOT_DRAFT)
  """
  savePostingDraft(organizationId: ID!, id: ID, input: PostingDraftInput!): Posting!
  "DRAFT → RECRUITING. 필수 값 누락은 POSTING_400(fieldErrors의 field가 basicStep·positionsStep·interviewStep·questionsStep), 이미 게시면 POSTING_409, 이용권 없으면 ORG_402"
  publishPosting(id: ID!): Posting!
  "취합 화면 최종 결과 변경, 여러 명 가능. 평가 미완료 지원자 포함 또는 이미 확정이면 EVALUATION_409"
  setDocResult(applicationIds: [ID!]!, result: DocResult!): [Application!]!
  "확정 조건 미충족 EVALUATION_422(extensions.reason: NOT_ALL_EVALUATED / RESULT_NOT_SELECTED / HOLD_REMAINING / NO_APPLICANTS), 이미 확정 EVALUATION_423"
  confirmDocResult(postingId: ID!): ConfirmDocResultPayload!
  "submit false는 자동 저장(DRAFT, 빈 값 허용), true는 저장 버튼(SAVED, 의견·문항별 점수 필수). 확정 후 EVALUATION_423, 검증 실패 COMMON_400"
  saveDocEvaluation(input: SaveDocEvaluationInput!, submit: Boolean!): SaveDocEvaluationPayload!
}

"""
보내지 않거나 null이면 기존 값 유지
단, semester·region·fee·eligibilityNote·activityStartedOn·activityEndedOn은 생략하면 유지, null이면 지움
"""
input PostingDraftInput {
  "최대 100자"
  title: String
  content: String
  "최대 20자"
  semester: String
  "최대 100자"
  region: String
  "최대 50자"
  fee: String
  allowEnrolled: Boolean
  allowOnLeave: Boolean
  "최대 200자"
  eligibilityNote: String
  activityStartedOn: Date
  activityEndedOn: Date
  recruitStartAt: DateTime
  recruitEndAt: DateTime
  "최대 5장, 통째로 교체"
  images: [PostingImageInput!]
  noPosition: Boolean
  "통째로 교체, 저장할 때마다 포지션 id가 새로 생김"
  positions: [PositionInput!]
  hasInterview: Boolean
  interviewMethod: InterviewMethod
  "1분 이상"
  interviewMinutes: Int
  "0분 이상"
  breakMinutes: Int
  assignRule: AssignRule
  "1명 이상"
  maxApplicantsPerInterview: Int
  "1개 이상"
  maxParallelInterviews: Int
  "통째로 교체, 같은 날짜 안에서 겹치면 COMMON_400"
  interviewTimeRanges: [InterviewTimeRangeInput!]
  docScorePerQuestion: Boolean
  "통째로 교체"
  questions: [QuestionInput!]
}

input PostingImageInput {
  url: String!
  sortOrder: Int!
  "여러 장에 true면 COMMON_400, 하나도 없으면 첫 번째 사진"
  isRepresentative: Boolean = false
}

input PositionInput {
  teamId: ID
  "최대 50자"
  name: String!
  "null = 모집 인원 미정, 1 이상"
  headcount: Int
  sortOrder: Int!
}

input QuestionInput {
  "null = 공통 문항, 같은 저장 이후의 포지션 id"
  positionId: ID
  type: QuestionType!
  "최대 200자"
  title: String!
  "최대 500자"
  description: String
  required: Boolean!
  "TEXT 글자 수 제한, 1 이상"
  maxLength: Int
  options: QuestionOptionsInput
  sortOrder: Int!
}

"해당 유형 값만 채움"
input QuestionOptionsInput {
  choices: [String!]
  columns: [String!]
  maxRows: Int
  maxFiles: Int
}

input InterviewTimeRangeInput {
  "null = 포지션 없는 모집 또는 전체 공통"
  positionId: ID
  date: Date!
  startTime: LocalTime!
  endTime: LocalTime!
  closedSlots: [LocalTime!]
}

extend type DocEvaluation {
  "DRAFT / SAVED, NONE은 안 나옴"
  status: MyDocEvaluationStatus!
}

input SaveDocEvaluationInput {
  applicationId: ID!
  "submit true면 필수"
  opinion: Opinion
  "posting.docScorePerQuestion = true일 때만, submit true면 전 문항 필수"
  scores: [DocScoreInput!]
  "최대 300자"
  memo: String
}

input DocScoreInput {
  "그 지원서 포지션에 적용되는 문항만"
  questionId: ID!
  "1~5"
  score: Int!
}

type SaveDocEvaluationPayload {
  evaluation: DocEvaluation!
  "공고 전체에서 내 평가가 NONE/DRAFT인 지원서 수, 0이면 전체 완료"
  remainingCount: Int!
  "제출일 최신순 첫 미평가 지원서, 칩 순서로 다음이 없을 때만 사용"
  nextUnevaluatedApplicationId: ID
}

type ConfirmDocResultPayload {
  "docResultConfirmedAt 채워짐"
  posting: Posting!
  summary: DocResultSummary!
}

input ApplicationInput {
  positionId: ID
  answers: [AnswerInput!]!
  "면접 있는 공고만"
  availableTimes: [DateTime!]
}

input AnswerInput {
  questionId: ID!
  "TEXT는 입력 그대로, ACTIVITY는 JSON 문자열"
  content: String
  attachments: [AttachmentInput!]
}

"명세에 정의 없이 'fileKey 또는 url'만 있어 두 필드로 둠, 백엔드 확인 필요"
input AttachmentInput {
  fileKey: String
  url: String
}

input UpdateProfileInput {
  name: String
  "업로드한 파일 URL, 빈 문자열이면 기본 아바타"
  profileImageUrl: String
  "로그인 ID가 바뀜"
  phone: String
  "아래 4개는 지원자 프로필용, 정보 수정 화면에는 없음"
  email: String
  birthYear: Int
  grade: Int
  major: String
}

input ChangePasswordInput {
  currentPassword: String!
  "회원가입과 같은 규칙 (8~64자, 영문+숫자)"
  newPassword: String!
}

input UpdateOrganizationInput {
  "업로드한 fileUrl, null·빈 문자열이면 기본 이미지로 초기화. 기존 로고를 유지하려면 그 주소를 다시 보냄"
  logoUrl: String
  "최대 40자"
  tagline: String!
  "학생회는 빈 배열"
  fields: [OrganizationField!]!
  "1~10개, 중복 제거"
  keywords: [String!]!
  "1개 이상"
  links: [OrganizationLinkInput!]!
}

input OrganizationLinkInput {
  "http, https만, 500자까지. type은 서버가 도메인으로 판별"
  url: String!
}

enum NotificationTab {
  APPLICANT
  OPERATOR
}

