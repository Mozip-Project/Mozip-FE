mutation ReportPosting($postingId: ID!, $reason: ReportReason!, $detail: String) {
  reportPosting(postingId: $postingId, reason: $reason, detail: $detail)
}

# TODO: 필터·정렬 연결
query Postings($page: Int, $size: Int) {
  postings(page: $page, size: $size) {
    totalCount
    items {
      id
      title
      organization {
        name
        type
      }
      thumbnailUrl
      recruitEndAt
      positions {
        id
        name
        sortOrder
      }
    }
  }
}
