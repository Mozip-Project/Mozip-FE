query Notifications($tab: NotificationTab, $page: Int) {
  notifications(tab: $tab, page: $page) {
    content {
      id
      type
      title
      linkUrl
      isRead
      createdAt
      organization {
        name
      }
    }
    totalCount
  }
}

query NotificationUnreadCount {
  notifications {
    unreadCount {
      all
      operator
      applicant
    }
  }
}

mutation MarkNotificationsRead($ids: [ID!]) {
  markNotificationsRead(ids: $ids)
}
