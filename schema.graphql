  updatedAt: DateTime!
}

enum InterviewMethod {
  ONSITE
  ONLINE
}

"""
면접 질문
"""
type InterviewQuestion {
  id: ID!
  posting: Posting!

  """
  null = 공통 질문
  """
  position: Position
  content: String!
  sortOrder: Int!
}

"""
등록된 면접 질문이면 question, 면접 중 즉석 질문이면 customQuestion을 채움
"""
type InterviewScore {
  question: InterviewQuestion
  customQuestion: String
  score: Int
  memo: String
}

"""
운영진이 연 면접 가능 시간대
"""
type InterviewTimeRange {
  id: ID!
  posting: Posting!

  """
  이 시간을 쓰는 포지션(팀), null = 포지션 없는 모집 또는 전체 공통
  """
  position: Position
  date: Date!
  startTime: LocalTime!
  endTime: LocalTime!

  """
  운영진이 끈 블록의 시작 시각, 지원자에게 안 보임
  """
