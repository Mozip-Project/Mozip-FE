  name: String!
  authority: Authority!
  status: UserStatus!
  lastRole: Role!

  """
  운영진 홈에서 마지막으로 고른 단체 (GNB 단체 전환)
  """
  lastOrganization: Organization

  """
  학교 인증 승인 시 채움, null = 미인증 (공고 열람만 가능)
  """
  school: School
  profileImageUrl: String
  department: String
  grade: Int
  contactEmail: String
  marketingAgreed: Boolean!
  termsAgreedAt: DateTime!

  """
  지원 결과, 면접 일정 알림
  """
  notifyResult: Boolean!

  """
  스크랩 공고 지원 시작 알림
  """
  notifyScrap: Boolean!

  """
  대표자 인수 요청, 평가 마감 알림
  """
  notifyOperator: Boolean!
  experiences: [Experience!]!
  createdAt: DateTime!
}

enum UserStatus {
  ACTIVE

  """
  로그인 5회 실패 (휴대폰 인증으로 해제)
  """
  LOCKED
  WITHDRAWN
}
