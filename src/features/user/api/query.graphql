query Me {
  me {
    id
    lastOrganization {
      id
    }
    memberships {
      role
      organization {
        id
        name
      }
    }
  }
}

query MyAccount {
  me {
    ...MyAccountFields
  }
}

mutation UpdateNotificationSettings($input: NotificationSettingsInput!) {
  updateNotificationSettings(input: $input) {
    ...MyAccountFields
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    ...MyAccountFields
  }
}

mutation RequestPhoneChange($phone: String!) {
  requestPhoneChange(phone: $phone)
}

mutation VerifyPhoneChange($phone: String!, $code: String!) {
  verifyPhoneChange(phone: $phone, code: $code)
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input)
}

fragment MyAccountFields on Me {
  id
  phone
  name
  profileImageUrl
  school {
    name
  }
  schoolVerification {
    schoolName
    email
    school {
      name
    }
  }
  memberships {
    id
    role
    organization {
      id
      name
    }
    team {
      name
    }
  }
  notificationSettings {
    notifyResult
    notifyScrap
    notifyOperator
    marketingAgreed
  }
}

mutation Withdraw {
  withdraw
}
