# 서버에 아직 없는 query·mutation의 명세 기준 임시 정의, 응답은 MSW handler
# 서버에 생기면 pnpm schema:pull로 받은 schema.graphql에 있는지 확인한 뒤 여기서 삭제
# 서버에 Mutation 타입이 생기면 아래 type Mutation을 extend type Mutation으로 변경

extend type Query {
  "tab 생략 시 전체 탭, 최신순"
  notifications(tab: NotificationTab, page: Int = 0, size: Int = 20): NotificationPage!
  me: Me!
  "대표자 먼저, 그 뒤 합류일 오름차순. 내보내진 운영진 제외"
  members(organizationId: ID!): [Member!]!
  "심사 전이거나 반려된 단체는 소속 운영진이 아니면 ORG_404"
  organization(id: ID!): Organization! @public
  "다른 단체가 등록한 키워드 중 접두 일치, 많이 쓴 순"
  keywordSuggestions(query: String!, limit: Int = 5): [String!]!
}

"단체 선택에 필요한 최소 필드만 정의, 나머지는 명세 me 참고"
type Me {
  id: ID!
  name: String!
  lastRole: Role!
  "운영진 홈에서 마지막으로 본 단체"
  lastOrganization: Organization
  memberships: [Member!]!
}

type Mutation {
  "ids 없으면 전체 읽음"
  markNotificationsRead(ids: [ID!]): Boolean!
  reportPosting(postingId: ID!, reason: ReportReason!, detail: String): Boolean!
  "단체명은 받지 않음, 검증 실패는 ORG_400"
  updateOrganization(id: ID!, input: UpdateOrganizationInput!): Organization!
}

input UpdateOrganizationInput {
  "업로드 후 받은 key, null이면 기존 로고 유지"
  logoFileKey: String
  "최대 40자"
  tagline: String!
  "학생회는 빈 배열"
  fields: [OrganizationField!]!
  "1~10개, 중복 제거"
  keywords: [String!]!
  "1개 이상"
  links: [OrganizationLinkInput!]!
}

input OrganizationLinkInput {
  "http, https만, 500자까지. type은 서버가 도메인으로 판별"
  url: String!
}

enum NotificationTab {
  APPLICANT
  OPERATOR
}

type NotificationPage {
  content: [Notification!]!
  totalCount: Int!
  "탭 배지 숫자"
  unreadCount: UnreadCount!
}

type UnreadCount {
  all: Int!
  operator: Int!
  applicant: Int!
}
