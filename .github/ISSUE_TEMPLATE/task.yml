name: '📝 작업 이슈'
description: 작업 내용을 등록하고 개발 브랜치를 생성합니다.
title: '[작업] '
body:
  - type: markdown
    attributes:
      value: |
        > 작업 타입과 브랜치 이름을 입력하면 이슈 생성 후 개발 브랜치가 자동으로 생성됩니다.
        > 브랜치 이름은 영문 소문자, 숫자, 하이픈(`-`)만 사용해주세요.

  - type: dropdown
    id: branch-type
    attributes:
      label: 작업 타입
      description: 브랜치 이름과 이슈 제목에 사용할 작업 타입을 선택해주세요.
      options:
        - ✨ Feature (feat) - 새 기능
        - 🐛 BugFix (fix) - 버그 수정
        - 🚨 Hotfix (hotfix) - 긴급 수정
        - ♻️ Refactor (refactor) - 코드 구조 개선
        - ✅ Test (test) - 테스트 추가 및 수정
        - 📝 Docs (docs) - 문서 수정
        - 🔧 Chore (chore) - 설정 및 기타 작업
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: 브랜치 이름
      description: 영문 소문자, 숫자, 하이픈(`-`)만 사용해주세요.
      placeholder: recruit-list
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📌 작업 설명
      description: 무엇을, 왜 작업하는지 작성해주세요.
      placeholder: 작업 배경과 목적을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 🛠️ 작업 목록
      description: 완료해야 할 작업을 목록으로 작성해주세요.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
