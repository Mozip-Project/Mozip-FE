mutation ReportPosting($postingId: ID!, $reason: ReportReason!, $detail: String) {
  reportPosting(postingId: $postingId, reason: $reason, detail: $detail)
}

query Postings($filter: PostingFilter, $sort: PostingSort, $page: Int, $size: Int) {
  postings(filter: $filter, sort: $sort, page: $page, size: $size) {
    totalCount
    items {
      id
      title
      organization {
        name
        type
      }
      thumbnailUrl
      recruitEndAt
      positions {
        id
        name
        sortOrder
      }
    }
  }
}

query Posting($id: ID!) {
  posting(id: $id) {
    id
    title
    content
    noPosition
    hasInterview
    allowEnrolled
    allowOnLeave
    eligibilityNote
    region
    fee
    recruitStartAt
    recruitEndAt
    docResultAt
    finalResultAt
    images {
      url
      isRepresentative
      sortOrder
    }
    positions {
      id
      name
      sortOrder
    }
    questions {
      id
      title
      sortOrder
      position {
        id
      }
    }
    interviewTimeRanges {
      date
    }
    organization {
      name
      type
      logoUrl
      tagline
      keywords
      fields
      links {
        id
        url
      }
    }
    otherActivePostings {
      id
      title
      recruitStartAt
      recruitEndAt
    }
  }
}
