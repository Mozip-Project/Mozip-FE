# 모집 관리 화면(지원자 관리·서류 평가·서류 평가 취합)과 LNB가 같이 쓰는 공고 정보
# 포지션 열, 결과 칩·평가 버튼·확정 후 화면, 면접 단계 구성용
query RecruitmentPosting($id: ID!) {
  posting(id: $id) {
    id
    status
    hasInterview
    noPosition
    docResultConfirmedAt
  }
}

query PostingApplications(
  $postingId: ID!
  $positionId: ID
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  postingApplications(
    postingId: $postingId
    positionId: $positionId
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      id
      user {
        name
      }
      position {
        name
      }
      docResult
      finalResult
    }
    totalCount
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}

query DocEvaluationApplications(
  $postingId: ID!
  $tab: DocEvaluationTab
  $positionIds: [ID!]
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  docEvaluationApplications(
    postingId: $postingId
    tab: $tab
    positionIds: $positionIds
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      application {
        id
        user {
          name
        }
        position {
          name
        }
        submittedAt
      }
      myEvaluationStatus
    }
    totalCount
    tabCounts {
      all
      notEvaluated
      evaluated
    }
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}

query DocEvaluationSummary(
  $postingId: ID!
  $tab: DocResultTab
  $positionIds: [ID!]
  $keyword: String
  $sort: DocSummarySort
  $page: Int
) {
  docEvaluationSummary(
    postingId: $postingId
    tab: $tab
    positionIds: $positionIds
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      application {
        id
        user {
          name
        }
        position {
          id
          name
        }
        docResult
      }
      rank
      averageScore
      opinionCounts {
        pass
        hold
        fail
        notEvaluated
      }
      evaluationComplete
    }
    tabCounts {
      all
      pass
      hold
      fail
    }
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
    summary {
      totalCount
      evaluatedCount
      holdCount
      passCount
      failCount
      allEvaluated
      pendingCount
      canConfirm
    }
  }
}

mutation SetDocResult($applicationIds: [ID!]!, $result: DocResult!) {
  setDocResult(applicationIds: $applicationIds, result: $result) {
    id
    docResult
  }
}

mutation ConfirmDocResult($postingId: ID!) {
  confirmDocResult(postingId: $postingId) {
    posting {
      id
      docResultConfirmedAt
    }
  }
}
