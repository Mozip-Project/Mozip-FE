# 결과 열 구성과 결과 칩 계산용
query ApplicantManagementPosting($id: ID!) {
  posting(id: $id) {
    id
    status
    hasInterview
    noPosition
    docResultConfirmedAt
  }
}

query PostingApplications(
  $postingId: ID!
  $positionId: ID
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  postingApplications(
    postingId: $postingId
    positionId: $positionId
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      id
      user {
        name
      }
      position {
        name
      }
      docResult
      finalResult
    }
    totalCount
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}

# 파트 열과 평가 버튼(확정 후 평가 보기) 구성용
query DocumentReviewPosting($id: ID!) {
  posting(id: $id) {
    id
    noPosition
    docResultConfirmedAt
  }
}

query DocEvaluationApplications(
  $postingId: ID!
  $tab: DocEvaluationTab
  $positionIds: [ID!]
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  docEvaluationApplications(
    postingId: $postingId
    tab: $tab
    positionIds: $positionIds
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      application {
        id
        user {
          name
        }
        position {
          name
        }
        submittedAt
      }
      myEvaluationStatus
    }
    totalCount
    tabCounts {
      all
      notEvaluated
      evaluated
    }
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}
