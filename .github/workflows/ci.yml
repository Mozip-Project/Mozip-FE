name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      test: ${{ steps.test.outcome }}
      prettier: ${{ steps.prettier.outcome }}
      build: ${{ steps.build.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        id: typecheck
        run: pnpm type-check

      - name: ESLint check
        id: lint
        run: pnpm lint

      - name: Unit test
        id: test
        run: pnpm test:run

      - name: Prettier check
        id: prettier
        run: pnpm format:check

      - name: Build check
        id: build
        run: pnpm build

      - name: Write CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## 🚦 CI 검증 결과"
            echo ""
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 🧠 TypeScript 타입 체크 | ${{ steps.typecheck.outcome }} |"
            echo "| 🧹 ESLint 검사 | ${{ steps.lint.outcome }} |"
            echo "| 🧪 Test 검사 | ${{ steps.test.outcome }} |"
            echo "| 🎨 Prettier 검사 | ${{ steps.prettier.outcome }} |"
            echo "| 🏗️ Build 검증 | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment CI result on pull request
        uses: actions/github-script@v7
        env:
          TYPECHECK_OUTCOME: ${{ needs.verify.outputs.typecheck }}
          LINT_OUTCOME: ${{ needs.verify.outputs.lint }}
          TEST_OUTCOME: ${{ needs.verify.outputs.test }}
          PRETTIER_OUTCOME: ${{ needs.verify.outputs.prettier }}
          BUILD_OUTCOME: ${{ needs.verify.outputs.build }}
        with:
          script: |
            const marker = '<!-- ci-result-comment -->';
            const body = [
              marker,
              '## 🚦 CI 검증 결과',
              '',
              '| 항목 | 결과 |',
              '| --- | --- |',
              `| 🧠 TypeScript 타입 체크 | ${process.env.TYPECHECK_OUTCOME} |`,
              `| 🧹 ESLint 검사 | ${process.env.LINT_OUTCOME} |`,
              `| 🧪 Test 검사 | ${process.env.TEST_OUTCOME} |`,
              `| 🎨 Prettier 검사 | ${process.env.PRETTIER_OUTCOME} |`,
              `| 🏗️ Build 검증 | ${process.env.BUILD_OUTCOME} |`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user?.type === 'Bot' && comment.body?.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
