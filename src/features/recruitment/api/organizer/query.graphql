# 모집 관리 화면(지원자 관리·서류 평가·서류 평가 취합)과 LNB가 같이 쓰는 공고 정보
# 포지션 열, 결과 칩·평가 버튼·확정 후 화면, 면접 단계 구성용
query RecruitmentPosting($id: ID!) {
  posting(id: $id) {
    id
    status
    hasInterview
    noPosition
    docResultConfirmedAt
    docScorePerQuestion
  }
}

query PostingApplications(
  $postingId: ID!
  $positionId: ID
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  postingApplications(
    postingId: $postingId
    positionId: $positionId
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      id
      user {
        name
      }
      position {
        name
      }
      docResult
      finalResult
    }
    totalCount
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}

query DocEvaluationApplications(
  $postingId: ID!
  $tab: DocEvaluationTab
  $positionIds: [ID!]
  $keyword: String
  $sort: ApplicationSort
  $page: Int
) {
  docEvaluationApplications(
    postingId: $postingId
    tab: $tab
    positionIds: $positionIds
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      application {
        id
        user {
          name
        }
        position {
          name
        }
        submittedAt
      }
      myEvaluationStatus
    }
    totalCount
    tabCounts {
      all
      notEvaluated
      evaluated
    }
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
  }
}

# 칩은 목록 조건 없이 공고 전체 지원자 사용
query DocEvaluationApplicationChips($postingId: ID!) {
  docEvaluationApplicationChips(postingId: $postingId) {
    application {
      id
      user {
        name
      }
    }
    myEvaluationStatus
  }
}

# 서류 평가하기 지원서, 학교·전화번호는 제출 시점 프로필(profileSnapshot)
query DocEvaluationApplicationDetail($id: ID!) {
  application(id: $id) {
    id
    user {
      name
    }
    position {
      id
      name
    }
    profileSnapshot
    availableTimes
    answers {
      id
      question {
        id
        type
        title
        description
        required
        maxLength
        sortOrder
        options {
          activityFields
        }
      }
      content
      attachments {
        id
        type
        url
        fileName
      }
    }
  }
}

# 서류 평가하기 문항 번호용, 답하지 않은 문항은 지원서 answers에서 빠져 공고 문항으로 매김
query PostingQuestions($id: ID!) {
  posting(id: $id) {
    id
    questions {
      id
      type
      sortOrder
      position {
        id
      }
    }
  }
}

# 서류 평가하기 패널의 내 평가, 평가 전이면 null
query MyDocEvaluation($applicationId: ID!) {
  myDocEvaluation(applicationId: $applicationId) {
    ...MyDocEvaluationFields
  }
}

mutation SaveDocEvaluation($input: SaveDocEvaluationInput!, $submit: Boolean!) {
  saveDocEvaluation(input: $input, submit: $submit) {
    evaluation {
      ...MyDocEvaluationFields
    }
    remainingCount
    nextUnevaluatedApplicationId
  }
}

# 조회와 저장 응답을 같은 캐시에 넣도록 같은 필드 사용
fragment MyDocEvaluationFields on DocEvaluation {
  id
  status
  opinion
  memo
  scores {
    question {
      id
    }
    score
  }
  updatedAt
}

query DocEvaluationSummary(
  $postingId: ID!
  $tab: DocResultTab
  $positionIds: [ID!]
  $keyword: String
  $sort: DocSummarySort
  $page: Int
) {
  docEvaluationSummary(
    postingId: $postingId
    tab: $tab
    positionIds: $positionIds
    keyword: $keyword
    sort: $sort
    page: $page
  ) {
    rows {
      application {
        id
        user {
          name
        }
        position {
          id
          name
        }
        docResult
      }
      rank
      averageScore
      opinionCounts {
        pass
        hold
        fail
        notEvaluated
      }
      evaluationComplete
    }
    tabCounts {
      all
      pass
      hold
      fail
    }
    positionCounts {
      position {
        id
        name
      }
      count
    }
    page
    totalPages
    summary {
      totalCount
      evaluatedCount
      holdCount
      passCount
      failCount
      allEvaluated
      pendingCount
      canConfirm
    }
  }
}

mutation SetDocResult($applicationIds: [ID!]!, $result: DocResult!) {
  setDocResult(applicationIds: $applicationIds, result: $result) {
    id
    docResult
  }
}

mutation ConfirmDocResult($postingId: ID!) {
  confirmDocResult(postingId: $postingId) {
    posting {
      id
      docResultConfirmedAt
    }
  }
}

# 결과 안내 합격자·불합격자 탭, 발송 응답도 같은 모양
query ResultMessages($postingId: ID!, $type: MessageType!) {
  resultMessages(postingId: $postingId, type: $type) {
    ...ResultMessagesFields
  }
}

# 발송 중 진행률만, 받는 사람별 결과는 끝난 뒤 ResultMessages로 다시 받음
query ResultMessageProgress($postingId: ID!, $type: MessageType!) {
  resultMessages(postingId: $postingId, type: $type) {
    pass {
      ...ResultMessageProgressFields
    }
    fail {
      ...ResultMessageProgressFields
    }
  }
}

fragment ResultMessageProgressFields on ResultMessagePanel {
  message {
    id
    status
  }
  processedCount
  deliveredCount
  failedCount
}

mutation SaveMessage(
  $postingId: ID!
  $type: MessageType!
  $target: MessageTarget!
  $subject: String!
  $body: String!
) {
  saveMessage(postingId: $postingId, type: $type, target: $target, subject: $subject, body: $body) {
    ...ResultMessageFields
  }
}

mutation SendMessages($postingId: ID!, $type: MessageType!, $targets: [MessageTarget!]!) {
  sendMessages(postingId: $postingId, type: $type, targets: $targets) {
    ...ResultMessagesFields
  }
}

fragment ResultMessagesFields on ResultMessages {
  posting {
    id
    organization {
      name
    }
    interviewTimeRanges {
      date
    }
  }
  pass {
    ...ResultMessagePanelFields
  }
  fail {
    ...ResultMessagePanelFields
  }
}

fragment ResultMessagePanelFields on ResultMessagePanel {
  message {
    ...ResultMessageFields
  }
  variables
  recipientCount
  sendableCount
  processedCount
  deliveredCount
  failedCount
  recipients {
    ...ResultMessageRecipientFields
  }
}

fragment ResultMessageFields on Message {
  id
  status
  subject
  body
}

fragment ResultMessageRecipientFields on Recipient {
  application {
    id
    user {
      name
    }
    position {
      name
    }
  }
  email
  emailWarning
  suggestedDomain
  interview {
    startAt
    location
  }
  delivery {
    status
    failReason
  }
}
