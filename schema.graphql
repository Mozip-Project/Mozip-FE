}

type Invitation {
  id: ID!
  organization: Organization!
  inviter: User!

  """
  가입자면 바로 채움, 미가입이면 가입 시 contact로 찾아 채움
  """
  invitee: User

  """
  휴대폰 번호 또는 이메일
  """
  inviteeContact: String!
  status: InvitationStatus!

  """
  발송 후 7일
  """
  expiresAt: DateTime!
  createdAt: DateTime!
}

enum InvitationStatus {
  PENDING
  ACCEPTED
  DECLINED
  CANCELED
}

"""
초대 링크 (mozip.kr/invite/{token})
"""
type InviteLink {
  id: ID!
  organization: Organization!
  token: String!

  """
  생성 후 7일
  """
  expiresAt: DateTime!
}

"""
A JSON scalar
"""
scalar JSON

"""
24-hour clock time value string in the format `hh:mm:ss` or `hh:mm:ss.sss`.
"""
scalar LocalTime

"""
단체 운영진 (회원의 단체 소속)
"""
type Member {
  id: ID!
  organization: Organization!
  user: User!

  """
  한 팀에만 소속, 팀 없는 단체면 null
  """
  team: Team
  role: MemberRole!
  createdAt: DateTime!
}

enum MemberRole {
  REPRESENTATIVE
  OPERATOR
}

"""
합격자용과 불합격자용을 따로 작성해 두고 각각 발송 (합격자만 먼저 발송 가능)
"""
type Message {
  id: ID!
  posting: Posting!

  """
  보낸 운영진
  """
  sender: User!
  type: MessageType!
  target: MessageTarget!
  subject: String!

  """
  {이름} {포지션} {면접 기간} {활동 기간} 변수는 발송 시 지원자별로 치환
  """
  body: String!
  status: MessageStatus!

  """
  null = 작성 중
  """
  sentAt: DateTime
  deliveries: [MessageDelivery!]!
  createdAt: DateTime!
}

"""
지원자별 메일 발송 결과
"""
type MessageDelivery {
  id: ID!
  application: Application!

  """
  보낸 주소, 주소 수정 후 재발송하면 갱신
  """
  email: String!
  status: MessageDeliveryStatus!
  failReason: String
  updatedAt: DateTime!
}

enum MessageDeliveryStatus {
  PENDING
  SUCCESS
  FAILED
}

enum MessageStatus {
  DRAFT
  SENT
}

enum MessageTarget {
  ALL
  PASS
  FAIL
}

"""
지원자 안내 메시지 (공지, 결과 발표), 메일 발송 내역
"""
enum MessageType {
  NOTICE
  DOC_RESULT
  INTERVIEW
  FINAL_RESULT
}

type Notification {
  id: ID!
  type: NotificationType!

  """
  알림에 표시할 단체 (지원자 알림도 지원한 단체를 표시)
  """
  organization: Organization

  """
  결과 안내, 공지 알림이 가리키는 메시지 (결과 팝업, 공지 전문 보기), 그 외 알림은 null
  """
  message: Message
  title: String!
  linkUrl: String
  isRead: Boolean!
  createdAt: DateTime!
}

"""
알림 탭(지원자/운영진), 알림 설정 토글, 출처 라벨, 이동 화면을 type으로 정함
"""
enum NotificationType {
  POSTING_NOTICE
  DOC_RESULT
  FINAL_RESULT
  INTERVIEW_RESELECT
  SCRAP_OPEN
  INVITATION
  TRANSFER_REQUEST
  TRANSFER_APPROVED
  TRANSFER_REJECTED
  EVALUATION_REQUEST
  EVALUATION_DEADLINE
}

"""
평가 의견 (서류, 면접 공통)
"""
enum Opinion {
  PASS
  HOLD
  FAIL
}

type Organization {
  id: ID!
  name: String!

  """
  변경 요청 이름 (관리자 확인 후 반영)
  """
  pendingName: String
  type: OrganizationType!

  """
  학생회가 아니면 null
  """
  councilLevel: CouncilLevel
  scope: OrganizationScope!

  """
  연합이면 null
  """
  school: School
  logoUrl: String

  """
  한 줄 소개
  """
  tagline: String
  description: String

  """
  단체 메일
  """
  email: String
  noTeam: Boolean!
  proofLink: String
  proofFileUrl: String
  reviewStatus: ReviewStatus!
  rejectReason: String
  trialEndsAt: DateTime

  """
  유료 기능 사용 가능 기한
  """
  packageEndsAt: DateTime

  """
  UP하기 잔여권
  """
  upCredits: Int!
  keywords: [String!]!
  fields: [OrganizationField!]!
  links: [OrganizationLink!]!
  teams: [Team!]!
  members: [Member!]!
  createdAt: DateTime!
}

enum OrganizationField {
  ACADEMIC_STUDY
  IT_DEV
  DESIGN_MEDIA
  PERFORMANCE_MUSIC
  SPORTS
  CULTURE_HOBBY
  VOLUNTEER
  LANGUAGE_GLOBAL
  STARTUP_BUSINESS
  RELIGION
  ETC
}

type OrganizationLink {
  id: ID!
  type: OrganizationLinkType!
  url: String!
}

enum OrganizationLinkType {
  INSTAGRAM
  WEBSITE
  YOUTUBE
  ETC
}

"""
교내 / 연합 (연합이면 학교 없음)
"""
enum OrganizationScope {
  CAMPUS
  UNION
}

"""
단체, 팀, 운영진, 초대, 대표자 인수
"""
enum OrganizationType {
  CLUB
  ACADEMIC
  STUDENT_COUNCIL
}

type Payment {
  id: ID!
  organization: Organization!

  """
  결제한 대표자
  """
  user: User!
  product: PaymentProduct!

  """
  PACKAGE 적용 학기 (예: 2026-2), UP_ONCE면 null
  """
  semester: String
  amount: Int!
  status: PaymentStatus!
  pgTransactionId: String
  receiptUrl: String
  paidAt: DateTime
  createdAt: DateTime!
}

"""
등록한 카드 (PG 빌링키는 노출하지 않음)
"""
type PaymentMethod {
  id: ID!
  organization: Organization!
  cardName: String
  cardLast4: String
  createdAt: DateTime!
}

"""
학기 패키지 4,900원 / UP하기 1회 500원
"""
enum PaymentProduct {
  PACKAGE
  UP_ONCE
}

enum PaymentStatus {
  PAID
  REFUND_REQUESTED
  REFUNDED
  FAILED
}

"""
공고별 모집 포지션
"""
type Position {
  id: ID!
  posting: Posting!
  team: Team
  name: String!

  """
  null = 모집 인원 미정
  """
  headcount: Int
  sortOrder: Int!
}

"""
모집 공고
"""
type Posting {
  id: ID!
  organization: Organization!

  """
  이전 기수 불러오기로 만든 공고의 원본
  """
  sourcePosting: Posting
  title: String!

  """
  모집 학기 (예: 2026-2)
  """
  semester: String

  """
  모집 안내 (HTML)
  """
  content: String
  status: PostingStatus!

  """
  작성 중 단계 1~5
  """
  draftStep: Int
  hasInterview: Boolean!

  """
  비면접이면 null
  """
  interviewMethod: InterviewMethod
  noPosition: Boolean!

  """
  null = 비공개
  """
  region: String

  """
  null = 비공개
  """
  fee: String

  """
  지원 자격: 대학생
  """
  allowEnrolled: Boolean!

  """
  지원 자격: 휴학생
  """
  allowOnLeave: Boolean!

  """
  지원 자격 직접 입력 (예: 1~3학년, 졸업 예정자 가능)
  """
  eligibilityNote: String

  """
  활동 기간 시작 월 (1일)
  """
  activityStartedOn: Date

  """
  활동 기간 종료 월 (1일)
  """
  activityEndedOn: Date

  """
  게시 예정 시각, 이 시각이 되면 DRAFT에서 RECRUITING으로 전환, null = 게시하기 누를 때 바로 게시
  """
  publishAt: DateTime

  """
  실제 게시된 시각
  """
  publishedAt: DateTime

  """
  지원 접수 시작, 게시 후 이 시각 전까지는 공고만 보이고 지원 불가
  """
  recruitStartAt: DateTime
  recruitEndAt: DateTime

  """
  서류 결과 / 면접 일정 안내일
  """
  docResultAt: DateTime
  finalResultAt: DateTime

  """
  서류 평가 결과 확정 시각, null = 확정 전
  """
  docResultConfirmedAt: DateTime

  """
  면접 평가 결과 확정 시각, null = 확정 전
  """
  finalResultConfirmedAt: DateTime
  interviewMinutes: Int
  breakMinutes: Int
  assignRule: AssignRule
  maxApplicantsPerInterview: Int
  maxParallelInterviews: Int

  """
  서류 평가에 문항별 점수(1~5점) 사용
  """
  docScorePerQuestion: Boolean

  """
  면접 평가에 질문별 점수 사용
  """
  interviewScorePerQuestion: Boolean

  """
  지원자에게 보여줄 면접 안내 (준비물 등)
  """
  interviewGuide: String

  """
  타임테이블 확정 시각
  """
  timetableConfirmedAt: DateTime
  viewCount: Int!

  """
  최신순 정렬 기준 (게시, UP 시 갱신)
  """
  bumpedAt: DateTime
  images: [PostingImage!]!
  positions: [Position!]!
  questions: [Question!]!
  interviewQuestions: [InterviewQuestion!]!
  interviewTimeRanges: [InterviewTimeRange!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PostingImage {
  id: ID!
  url: String!

  """
  대표 이미지 (전체 공고 카드 썸네일), 안 고르면 첫 번째 사진
  """
