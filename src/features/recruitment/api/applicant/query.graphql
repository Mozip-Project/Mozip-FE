query PostingApplicationForm($id: ID!) {
  posting(id: $id) {
    id
    title
    noPosition
    hasInterview
    profilePhotoRequired
    positions {
      id
      name
      sortOrder
    }
    questions {
      id
      type
      title
      description
      required
      maxLength
      sortOrder
      position {
        id
      }
      options {
        activityFields
        maxEntries
        acceptFile
        acceptLink
        fileTypes
      }
    }
    interviewTimeRanges {
      date
      startTime
      endTime
      closedSlots
      position {
        id
      }
    }
  }
}

mutation SaveApplicationDraft($postingId: ID!, $input: ApplicationInput!) {
  saveApplicationDraft(postingId: $postingId, input: $input) {
    id
    updatedAt
  }
}

mutation SubmitApplication($id: ID!) {
  submitApplication(id: $id) {
    id
  }
}

# 로그인 쿠키가 필요해 브라우저에서 조회, 임시 저장 답변은 이어 쓰기에 사용
query PostingMyApplications($id: ID!) {
  posting(id: $id) {
    id
    myApplications {
      id
      submittedAt
      updatedAt
      position {
        id
      }
      availableTimes
      answers {
        question {
          id
        }
        content
        attachments {
          type
          url
        }
      }
    }
  }
}

# 지원서 1단계 프로필 카드, 로그인 쿠키가 필요해 브라우저에서 조회
query ApplicantProfile {
  me {
    id
    name
    phone
    profileImageUrl
    school {
      name
    }
    schoolVerification {
      schoolName
      email
      school {
        name
      }
    }
  }
}

# 내 지원의 제출한 지원서, 비운 문항도 카드로 보여 주려고 공고 문항까지 조회
query SubmittedApplication($id: ID!) {
  application(id: $id) {
    id
    submittedAt
    availableTimes
    position {
      id
      name
    }
    posting {
      id
      title
      questions {
        id
        type
        title
        description
        required
        maxLength
        sortOrder
        position {
          id
        }
        options {
          activityFields
        }
      }
    }
    answers {
      id
      question {
        id
      }
      content
      attachments {
        id
        type
        url
        fileName
      }
    }
  }
}

# 내 지원 목록, 작성 중 개수까지 쓰려고 status 없이 전체 조회
query MyApplications {
  myApplications {
    id
    status
    submittedAt
    docResult
    finalResult
    position {
      id
      name
    }
    posting {
      id
      title
      status
      hasInterview
      docResultAt
      finalResultAt
      organization {
        name
      }
    }
  }
}
