# pnpm schema:pull로 개발 서버 introspection 결과를 받은 파일, 직접 수정 금지

" 도메인별 파일로 나누고 extend type Query/Mutation으로 추가\n 로그인 없이 호출할 수 있는 최상위 필드에 붙임 (없으면 인증 필요, GraphqlAuthInstrumentation이 검사)"
directive @public on FIELD_DEFINITION

"""
This directive allows results to be deferred during execution
"""
directive @defer(
  """
  Deferred behaviour is controlled by this argument
  """
  if: Boolean! = true

  """
  A unique label that represents the fragment being deferred
  """
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
This directive disables error propagation when a non nullable field returns null for the given operation.
"""
directive @experimental_disableErrorPropagation on QUERY | MUTATION | SUBSCRIPTION

"""
지원서 문항별 답변
"""
type Answer {
  id: ID!
  question: Question!

  """
  TEXT 답변, CHOICE / TABLE은 JSON 문자열
  """
  content: String
  attachments: [Attachment!]!
}

"""
지원서
"""
type Application {
  id: ID!
  posting: Posting!

  """
  포지션 없는 모집이면 null
  """
  position: Position
  user: User!
  status: ApplicationStatus!

  """
  제출 시점 프로필
  """
  profileSnapshot: JSON

  """
  면접 가능 시간 블록의 시작 시각 목록
  """
  availableTimes: [DateTime!]!
  docResult: DocResult!
  finalResult: FinalResult!
  submittedAt: DateTime
  answers: [Answer!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
지원서, 답변, 첨부
"""
enum ApplicationStatus {
  DRAFT
  SUBMITTED
}

"""
면접관 자동 배정 기준 (포지션 없는 모집은 자동 배정 없이 직접 추가)
"""
enum AssignRule {
  """
  지원 포지션과 같은 팀 운영진
  """
  SAME_TEAM

  """
  팀 상관없이 운영진 전체
  """
  ALL_MEMBERS
}

"""
FILE_LINK 문항 첨부
"""
type Attachment {
  id: ID!
  type: AttachmentType!
  url: String!
  fileName: String
}

enum AttachmentType {
  FILE
  LINK
}

"""
Spring Security 권한
"""
enum Authority {
  USER
  ADMIN
}

"""
공고 UP하기 내역
"""
type Bump {
  id: ID!
  posting: Posting!
  user: User!

  """
  null = 잔여권 사용
  """
  payment: Payment
  createdAt: DateTime!
}

"""
학생회 세부 구분 (총학생회 / 단과대 / 학과)
"""
enum CouncilLevel {
  UNIVERSITY
  COLLEGE
  DEPARTMENT
}

"""
ISO-8601 날짜 (예: 2026-11-15)
"""
scalar Date

"""
서울 시각에 오프셋을 붙인 ISO-8601 (예: 2026-11-15T14:00:00+09:00)
"""
scalar DateTime

"""
운영진별 서류 평가
"""
type DocEvaluation {
  id: ID!
  application: Application!

  """
  평가한 운영진
  """
  member: Member!

  """
  자동 저장만 된 작성 중 상태에서는 null
  """
  opinion: Opinion

  """
  운영진만 보는 메모, 최대 300자
  """
  memo: String

  """
  문항별 점수, posting.docScorePerQuestion = true일 때만
  """
  scores: [DocScore!]!

  """
  저장하고 다음 지원자 보기로 저장한 시각, null = 작성 중
  """
  submittedAt: DateTime
  updatedAt: DateTime!
}

enum DocResult {
  """
  평가가 다 끝나지 않아 선택 불가
  """
  PENDING

  """
  보류 (남아 있으면 결과 확정 불가)
  """
  HOLD
  PASS
  FAIL
}

type DocScore {
  question: Question!

  """
  1~5점
  """
  score: Int!
}

"""
활동 경험
"""
type Experience {
  id: ID!

  """
  활동명
  """
  title: String!
  role: String
  achievement: String
