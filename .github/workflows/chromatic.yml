name: 'Chromatic Deployment'

on:
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/assets/**'
      - 'src/styles/**'
      - 'src/lib/utils.ts'
      - 'src/utils/**'
      - '**/*.stories.tsx'
      - '.storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/assets/**'
      - 'src/styles/**'
      - 'src/lib/utils.ts'
      - 'src/utils/**'
      - '**/*.stories.tsx'
      - '.storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: 'Run Chromatic'
    # 저장소 Secret을 받지 못하는 fork·Dependabot PR 제외
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      storybook-url: ${{ steps.chromatic.outputs.storybookUrl }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish Storybook to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

  comment:
    needs: chromatic
    if: ${{ github.event_name == 'pull_request' && needs.chromatic.outputs.storybook-url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Comment Storybook link on pull request
        uses: actions/github-script@v7
        env:
          STORYBOOK_URL: ${{ needs.chromatic.outputs.storybook-url }}
        with:
          script: |
            const marker = '<!-- chromatic-storybook-comment -->';
            const body = [
              marker,
              '## 📚 Storybook 미리보기',
              '',
              process.env.STORYBOOK_URL,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user?.type === 'Bot' && comment.body?.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
